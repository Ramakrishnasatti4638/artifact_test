<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔗 URL Shortener</h1>
      
      <div class="input-section">
        <input 
          type="url" 
          id="urlInput" 
          placeholder="Enter your long URL here..."
          class="url-input"
        >
        <button id="shortenBtn" class="btn btn-primary">Shorten URL</button>
      </div>

      <div id="resultSection" class="result-section" style="display: none;">
        <div class="result-card">
          <h3>✓ URL Shortened Successfully!</h3>
          <div class="result-item">
            <label>Original URL:</label>
            <p id="originalUrlDisplay" class="url-text"></p>
          </div>
          <div class="result-item">
            <label>Shortened URL:</label>
            <div class="url-copy-wrapper">
              <a id="shortUrlDisplay" class="url-text"></a>
              <button id="copyBtn" class="btn btn-copy">Copy</button>
            </div>
          </div>
        </div>
      </div>

      <div class="urls-list-section">
        <h2>All Shortened URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-message">No URLs shortened yet</p>
        </div>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
