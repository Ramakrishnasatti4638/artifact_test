<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="wizard-container">
      <h1>Registration Wizard</h1>
      
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Plan</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirm</div>
        </div>
      </div>

      <!-- Form Steps -->
      <form id="wizardForm">
        <!-- Step 1: Personal Details -->
        <div class="form-step active" data-step="1">
          <h2>Personal Details</h2>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              placeholder="Enter your full name"
              required
            >
            <span class="error-message" id="name-error"></span>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="Enter your email"
              required
            >
            <span class="error-message" id="email-error"></span>
          </div>
        </div>

        <!-- Step 2: Preferences -->
        <div class="form-step" data-step="2">
          <h2>Choose Your Plan</h2>
          <div class="plan-container">
            <div class="plan-option">
              <input 
                type="radio" 
                id="basic" 
                name="plan" 
                value="basic"
                required
              >
              <label for="basic" class="plan-label">
                <div class="plan-header">
                  <h3>Basic</h3>
                  <p class="plan-price">$9.99/mo</p>
                </div>
                <ul class="plan-features">
                  <li>✓ 5 Projects</li>
                  <li>✓ 10GB Storage</li>
                  <li>✓ Email Support</li>
                </ul>
              </label>
            </div>

            <div class="plan-option">
              <input 
                type="radio" 
                id="pro" 
                name="plan" 
                value="pro"
              >
              <label for="pro" class="plan-label popular">
                <div class="plan-badge">Most Popular</div>
                <div class="plan-header">
                  <h3>Pro</h3>
                  <p class="plan-price">$19.99/mo</p>
                </div>
                <ul class="plan-features">
                  <li>✓ 25 Projects</li>
                  <li>✓ 50GB Storage</li>
                  <li>✓ Priority Support</li>
                  <li>✓ Advanced Analytics</li>
                </ul>
              </label>
            </div>

            <div class="plan-option">
              <input 
                type="radio" 
                id="enterprise" 
                name="plan" 
                value="enterprise"
              >
              <label for="enterprise" class="plan-label">
                <div class="plan-header">
                  <h3>Enterprise</h3>
                  <p class="plan-price">$49.99/mo</p>
                </div>
                <ul class="plan-features">
                  <li>✓ Unlimited Projects</li>
                  <li>✓ 200GB Storage</li>
                  <li>✓ 24/7 Phone Support</li>
                  <li>✓ Custom Integrations</li>
                  <li>✓ Dedicated Account Manager</li>
                </ul>
              </label>
            </div>
          </div>
          <span class="error-message" id="plan-error"></span>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="form-step" data-step="3">
          <h2>Confirm Your Details</h2>
          <div class="confirmation-container">
            <div class="confirmation-section">
              <h3>Personal Information</h3>
              <div class="confirmation-item">
                <span class="label">Name:</span>
                <span class="value" id="confirm-name"></span>
              </div>
              <div class="confirmation-item">
                <span class="label">Email:</span>
                <span class="value" id="confirm-email"></span>
              </div>
            </div>

            <div class="confirmation-section">
              <h3>Selected Plan</h3>
              <div class="confirmation-item">
                <span class="label">Plan:</span>
                <span class="value plan-name" id="confirm-plan"></span>
              </div>
            </div>
          </div>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
          <div class="success-icon">✓</div>
          <h2>Registration Complete!</h2>
          <p>Thank you for signing up. We've sent a confirmation email to <span id="success-email"></span></p>
          <button type="button" class="btn btn-primary" onclick="resetForm()">Start Over</button>
        </div>

        <!-- Navigation Buttons -->
        <div class="form-navigation">
          <button type="button" class="btn btn-secondary" id="prevBtn">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
