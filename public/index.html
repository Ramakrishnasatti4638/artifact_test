<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="wizard-container">
      <h1>Sign Up Wizard</h1>
      
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Plan</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirm</div>
        </div>
      </div>

      <!-- Form Steps -->
      <form id="wizardForm">
        <!-- Step 1: Personal Details -->
        <div class="form-step active" data-step="1">
          <h2>Personal Details</h2>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
            <span class="error-message" id="name-error"></span>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
            <span class="error-message" id="email-error"></span>
          </div>
        </div>

        <!-- Step 2: Choose Plan -->
        <div class="form-step" data-step="2">
          <h2>Choose Your Plan</h2>
          <div class="plans-container">
            <div class="plan-card">
              <input type="radio" id="basic" name="plan" value="basic" required>
              <label for="basic" class="plan-label">
                <div class="plan-header">
                  <h3>Basic</h3>
                  <div class="plan-price">$9<span>/month</span></div>
                </div>
                <ul class="plan-features">
                  <li>✓ 5 Projects</li>
                  <li>✓ 10 GB Storage</li>
                  <li>✓ Email Support</li>
                </ul>
              </label>
            </div>
            
            <div class="plan-card">
              <input type="radio" id="pro" name="plan" value="pro" required>
              <label for="pro" class="plan-label">
                <div class="plan-header">
                  <h3>Pro</h3>
                  <div class="plan-price">$29<span>/month</span></div>
                </div>
                <ul class="plan-features">
                  <li>✓ Unlimited Projects</li>
                  <li>✓ 100 GB Storage</li>
                  <li>✓ Priority Support</li>
                  <li>✓ Advanced Analytics</li>
                </ul>
              </label>
            </div>
            
            <div class="plan-card">
              <input type="radio" id="enterprise" name="plan" value="enterprise" required>
              <label for="enterprise" class="plan-label">
                <div class="plan-header">
                  <h3>Enterprise</h3>
                  <div class="plan-price">$99<span>/month</span></div>
                </div>
                <ul class="plan-features">
                  <li>✓ Everything in Pro</li>
                  <li>✓ 1 TB Storage</li>
                  <li>✓ 24/7 Phone Support</li>
                  <li>✓ Custom Integration</li>
                  <li>✓ Dedicated Manager</li>
                </ul>
              </label>
            </div>
          </div>
          <span class="error-message" id="plan-error"></span>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="form-step" data-step="3">
          <h2>Confirm Your Details</h2>
          <div class="confirmation-summary">
            <div class="summary-section">
              <h3>Personal Information</h3>
              <div class="summary-item">
                <span class="summary-label">Name:</span>
                <span class="summary-value" id="confirm-name"></span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Email:</span>
                <span class="summary-value" id="confirm-email"></span>
              </div>
            </div>
            
            <div class="summary-section">
              <h3>Selected Plan</h3>
              <div class="summary-item">
                <span class="summary-label">Plan:</span>
                <span class="summary-value" id="confirm-plan"></span>
              </div>
            </div>
          </div>
          
          <div id="success-message" class="success-message" style="display: none;">
            <div class="success-icon">✓</div>
            <h3>Registration Successful!</h3>
            <p>Thank you for signing up. We've sent a confirmation email to your address.</p>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="form-navigation">
          <button type="button" id="prevBtn" class="btn btn-secondary" style="display: none;">Back</button>
          <button type="button" id="nextBtn" class="btn btn-primary">Next</button>
          <button type="submit" id="submitBtn" class="btn btn-success" style="display: none;">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
