<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span>Snip<strong>URL</strong></span>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1>Shorten your links<br/>in seconds</h1>
      <p class="subtitle">Paste any long URL and get a clean, shareable short link instantly.</p>

      <form id="shorten-form" class="shorten-box" novalidate>
        <input
          type="url"
          id="url-input"
          placeholder="https://example.com/your-very-long-url"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="shorten-btn">
          <span class="btn-text">Shorten</span>
          <span class="btn-spinner" hidden>
            <svg class="spin" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </span>
        </button>
      </form>
      <p id="error-msg" class="error-msg" hidden></p>

      <!-- Result card -->
      <div id="result-card" class="result-card" hidden>
        <div class="result-row">
          <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button id="copy-btn" class="copy-btn" title="Copy to clipboard">
            <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <svg id="check-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden><polyline points="20 6 9 17 4 12"/></svg>
            <span id="copy-label">Copy</span>
          </button>
        </div>
        <p id="original-preview" class="original-preview"></p>
      </div>
    </section>

    <!-- Links table -->
    <section class="links-section" id="links-section" hidden>
      <h2>Your Links</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Short URL</th>
              <th>Original URL</th>
              <th>Clicks</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="links-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
