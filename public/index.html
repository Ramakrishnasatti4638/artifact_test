<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .content {
      padding: 40px 20px;
    }

    .form-group {
      margin-bottom: 30px;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button {
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .urls-section {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 2px solid #e0e0e0;
    }

    .urls-section h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 1.5em;
    }

    .url-item {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .url-info {
      flex: 1;
      min-width: 0;
    }

    .url-item-original {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .url-item-short {
      font-weight: 600;
      color: #667eea;
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .url-item-stats {
      font-size: 0.85em;
      color: #999;
    }

    .url-item-actions {
      display: flex;
      gap: 10px;
      white-space: nowrap;
    }

    .copy-btn, .delete-btn, .stats-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9em;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .copy-btn {
      background: #667eea;
      color: white;
    }

    .copy-btn:hover {
      background: #5568d3;
    }

    .copy-btn.copied {
      background: #28a745;
    }

    .stats-btn {
      background: #17a2b8;
      color: white;
    }

    .stats-btn:hover {
      background: #138496;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      font-size: 1.1em;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #333;
    }

    .modal-content p {
      color: #666;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .modal-actions .close-btn {
      background: #e0e0e0;
      color: #333;
    }

    .modal-actions .close-btn:hover {
      background: #d0d0d0;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.8em;
      }

      .url-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .url-item-actions {
        width: 100%;
      }

      .copy-btn, .delete-btn, .stats-btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useCallback } = React;

    function URLShortener() {
      const [url, setUrl] = useState('');
      const [urls, setUrls] = useState([]);
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState('');
      const [stats, setStats] = useState(null);
      const [showStats, setShowStats] = useState(false);

      // Fetch all URLs
      const fetchUrls = useCallback(async () => {
        try {
          const response = await fetch('/api/urls');
          const data = await response.json();
          setUrls(data);
        } catch (err) {
          console.error('Error fetching URLs:', err);
        }
      }, []);

      // Load URLs on mount
      useEffect(() => {
        fetchUrls();
      }, [fetchUrls]);

      // Handle form submission
      const handleShorten = async (e) => {
        e.preventDefault();
        
        if (!url.trim()) {
          setMessage({ type: 'error', text: 'Please enter a URL' });
          return;
        }

        setLoading(true);
        setMessage('');

        try {
          const response = await fetch('/api/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });

          if (response.ok) {
            const data = await response.json();
            setMessage({ type: 'success', text: 'URL shortened successfully!' });
            setUrl('');
            fetchUrls();
          } else {
            const error = await response.json();
            setMessage({ type: 'error', text: error.error || 'Failed to shorten URL' });
          }
        } catch (err) {
          setMessage({ type: 'error', text: 'Error connecting to server' });
        } finally {
          setLoading(false);
        }
      };

      // Copy to clipboard
      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          setMessage({ type: 'success', text: 'Copied to clipboard!' });
          setTimeout(() => setMessage(''), 3000);
        });
      };

      // Delete URL
      const deleteUrl = async (id) => {
        if (confirm('Are you sure you want to delete this shortened URL?')) {
          try {
            const response = await fetch(`/api/urls/${id}`, { method: 'DELETE' });
            if (response.ok) {
              setMessage({ type: 'success', text: 'URL deleted successfully!' });
              fetchUrls();
            }
          } catch (err) {
            setMessage({ type: 'error', text: 'Failed to delete URL' });
          }
        }
      };

      // View stats
      const viewStats = async (shortCode) => {
        try {
          const response = await fetch(`/api/stats/${shortCode}`);
          if (response.ok) {
            const data = await response.json();
            setStats(data);
            setShowStats(true);
          }
        } catch (err) {
          setMessage({ type: 'error', text: 'Failed to load stats' });
        }
      };

      return (
        <div className="container">
          <div className="header">
            <h1>🔗 URL Shortener</h1>
            <p>Create short, shareable links instantly</p>
          </div>

          <div className="content">
            {message && (
              <div className={`message ${message.type}`}>
                {message.text}
              </div>
            )}

            <form onSubmit={handleShorten}>
              <div className="form-group">
                <label htmlFor="url">Enter a URL to shorten</label>
                <input
                  id="url"
                  type="url"
                  placeholder="https://example.com/very/long/url"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  disabled={loading}
                />
              </div>
              <button type="submit" className="button" disabled={loading}>
                {loading ? 'Shortening...' : 'Shorten URL'}
              </button>
            </form>

            {urls.length > 0 && (
              <div className="urls-section">
                <h2>Your Shortened URLs</h2>
                {urls.map((item) => (
                  <div key={item.id} className="url-item">
                    <div className="url-info">
                      <div className="url-item-short">{item.short_code}</div>
                      <div className="url-item-original">{item.long_url}</div>
                      <div className="url-item-stats">Clicks: {item.clicks} • Created: {new Date(item.created_at).toLocaleDateString()}</div>
                    </div>
                    <div className="url-item-actions">
                      <button className="copy-btn" onClick={() => copyToClipboard(`http://localhost:3001/s/${item.short_code}`)}>
                        Copy
                      </button>
                      <button className="stats-btn" onClick={() => viewStats(item.short_code)}>
                        Stats
                      </button>
                      <button className="delete-btn" onClick={() => deleteUrl(item.id)}>
                        Delete
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {urls.length === 0 && url === '' && (
              <div className="empty-state">
                <p>No shortened URLs yet. Create one to get started!</p>
              </div>
            )}
          </div>

          {showStats && stats && (
            <div className="modal" onClick={() => setShowStats(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h3>URL Statistics</h3>
                <p><strong>Short Code:</strong> {stats.short_code}</p>
                <p><strong>Total Clicks:</strong> {stats.clicks}</p>
                <p><strong>Created:</strong> {new Date(stats.created_at).toLocaleString()}</p>
                <p><strong>Original URL:</strong> <br/>{stats.long_url}</p>
                <div className="modal-actions">
                  <button className="close-btn" onClick={() => setShowStats(false)}>Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<URLShortener />);
  </script>
</body>
</html>
