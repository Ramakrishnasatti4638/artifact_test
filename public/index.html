<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>URL Shortener</h1>
      <p>Make your long URLs short and shareable</p>
    </header>

    <main>
      <section class="shortener-section">
        <form id="shortenForm" class="form">
          <div class="form-group">
            <label for="longUrl">Enter your URL:</label>
            <input
              type="url"
              id="longUrl"
              placeholder="https://example.com/very/long/url"
              required
            />
          </div>

          <div class="form-group">
            <label for="customAlias">Custom Alias (optional):</label>
            <input
              type="text"
              id="customAlias"
              placeholder="myalias"
            />
          </div>

          <button type="submit" class="btn btn-primary">Shorten URL</button>
        </form>

        <div id="result" class="result hidden">
          <div class="result-card">
            <div class="result-field">
              <label>Short URL:</label>
              <div class="result-value-wrapper">
                <span id="shortUrlDisplay" class="result-value"></span>
                <button type="button" class="btn-copy" onclick="copyToClipboard()">Copy</button>
              </div>
            </div>
            <div class="result-field">
              <label>Original URL:</label>
              <p class="result-value long-text" id="longUrlDisplay"></p>
            </div>
          </div>
        </div>

        <div id="error" class="error hidden"></div>
      </section>

      <section class="urls-section">
        <h2>Your Shortened URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-state">No URLs shortened yet. Create one above!</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
