<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Make your long URLs short and shareable</p>
    </header>

    <main>
      <section class="form-section">
        <form id="shortenForm">
          <div class="input-group">
            <input 
              type="url" 
              id="urlInput" 
              placeholder="Enter your long URL here..." 
              required
            >
            <button type="submit" class="btn-primary">Shorten</button>
          </div>
          <div id="error" class="error"></div>
          <div id="success" class="success"></div>
        </form>
      </section>

      <section class="result-section" id="resultSection" style="display: none;">
        <div class="result-card">
          <p class="result-label">Your shortened URL:</p>
          <div class="result-display">
            <input type="text" id="shortUrlDisplay" readonly class="short-url-input">
            <button class="btn-copy" id="copyBtn">Copy</button>
          </div>
        </div>
      </section>

      <section class="urls-section">
        <h2>Recent Shortened URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-state">No URLs shortened yet</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
