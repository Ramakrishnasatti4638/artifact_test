<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
    h1 { font-size: 2rem; color: #3730a3; margin-bottom: 8px; }
    p.sub { color: #6b7280; margin-bottom: 32px; }

    .stats { display: flex; gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; border-radius: 12px; padding: 20px 32px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: #4f46e5; }
    .stat-card .label { font-size: .85rem; color: #6b7280; margin-top: 4px; }

    .card { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 640px; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 32px; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="url"], input[type="text"] {
      flex: 1; min-width: 0; border: 1.5px solid #d1d5db; border-radius: 8px;
      padding: 10px 14px; font-size: 1rem; outline: none; transition: border .2s;
    }
    input:focus { border-color: #4f46e5; }
    button.primary {
      background: #4f46e5; color: white; border: none; border-radius: 8px;
      padding: 10px 22px; font-size: 1rem; cursor: pointer; white-space: nowrap; transition: background .2s;
    }
    button.primary:hover { background: #4338ca; }

    .alias-row { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    .alias-row label { font-size: .9rem; color: #6b7280; white-space: nowrap; }

    #result { margin-top: 16px; padding: 12px 16px; border-radius: 8px; background: #eff6ff; display: none; }
    #result .short-link { color: #4f46e5; font-weight: 600; word-break: break-all; }
    #result button.copy { margin-left: 8px; background: none; border: 1px solid #4f46e5; color: #4f46e5; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: .85rem; }
    #error { margin-top: 12px; color: #dc2626; font-size: .9rem; display: none; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #e5e7eb; color: #374151; }
    td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; word-break: break-all; }
    td:last-child { white-space: nowrap; }
    .badge { background: #eef2ff; color: #4f46e5; border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 600; }
    button.del { background: none; border: 1px solid #fca5a5; color: #dc2626; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .82rem; }
    button.del:hover { background: #fef2f2; }
    .empty { text-align: center; color: #9ca3af; padding: 32px; }
  </style>
</head>
<body>
  <h1>🔗 URL Shortener</h1>
  <p class="sub">Shorten any URL instantly</p>

  <div class="stats">
    <div class="stat-card"><div class="num" id="totalLinks">0</div><div class="label">Total Links</div></div>
    <div class="stat-card"><div class="num" id="totalClicks">0</div><div class="label">Total Clicks</div></div>
  </div>

  <div class="card">
    <div class="form-row">
      <input type="url" id="urlInput" placeholder="https://example.com/long-url" />
      <button class="primary" id="shortenBtn">Shorten</button>
    </div>
    <div class="alias-row">
      <label for="aliasInput">Custom alias (optional):</label>
      <input type="text" id="aliasInput" placeholder="my-link" style="max-width:180px;" />
    </div>
    <div id="error"></div>
    <div id="result">
      Short URL: <span class="short-link" id="shortLink"></span>
      <button class="copy" id="copyBtn">Copy</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:16px;color:#374151;font-size:1.1rem;">Your Links</h2>
    <table id="linksTable">
      <thead><tr><th>Original URL</th><th>Short Code</th><th>Clicks</th><th></th></tr></thead>
      <tbody id="linksBody"><tr><td colspan="4" class="empty">No links yet</td></tr></tbody>
    </table>
  </div>

  <script>
    const urlInput   = document.getElementById('urlInput');
    const aliasInput = document.getElementById('aliasInput');
    const shortenBtn = document.getElementById('shortenBtn');
    const resultDiv  = document.getElementById('result');
    const shortLink  = document.getElementById('shortLink');
    const copyBtn    = document.getElementById('copyBtn');
    const errorDiv   = document.getElementById('error');
    const linksBody  = document.getElementById('linksBody');
    const totalLinks = document.getElementById('totalLinks');
    const totalClicks= document.getElementById('totalClicks');

    async function loadLinks() {
      const res = await fetch('/api/links');
      const links = await res.json();
      totalLinks.textContent = links.length;
      totalClicks.textContent = links.reduce((s, l) => s + l.clicks, 0);
      if (links.length === 0) {
        linksBody.innerHTML = '<tr><td colspan="4" class="empty">No links yet</td></tr>';
        return;
      }
      linksBody.innerHTML = links.map(l => `
        <tr>
          <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.url}">${l.url}</td>
          <td><code>${l.code}</code></td>
          <td><span class="badge">${l.clicks}</span></td>
          <td><button class="del" data-code="${l.code}">Delete</button></td>
        </tr>`).join('');
    }

    shortenBtn.addEventListener('click', async () => {
      errorDiv.style.display = 'none';
      resultDiv.style.display = 'none';
      const url   = urlInput.value.trim();
      const alias = aliasInput.value.trim();
      if (!url) { showError('Please enter a URL.'); return; }
      const body = { url };
      if (alias) body.alias = alias;
      const res = await fetch('/api/shorten', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { showError(data.error); return; }
      shortLink.textContent = window.location.origin + data.shortUrl;
      resultDiv.style.display = 'block';
      urlInput.value = '';
      aliasInput.value = '';
      loadLinks();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLink.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
      });
    });

    linksBody.addEventListener('click', async e => {
      if (!e.target.matches('button.del')) return;
      const code = e.target.dataset.code;
      await fetch(`/api/links/${code}`, { method: 'DELETE' });
      loadLinks();
    });

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    loadLinks();
  </script>
</body>
</html>
