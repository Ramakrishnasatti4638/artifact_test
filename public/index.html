<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 1rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #6366f1;
    }

    input[type="url"]::placeholder {
      color: #475569;
    }

    button {
      padding: 12px 22px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }

    .error {
      color: #f87171;
      font-size: 0.875rem;
      margin-top: 10px;
      min-height: 20px;
    }

    .result-box {
      display: none;
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 16px;
      display: none;
      align-items: center;
      gap: 12px;
    }

    .result-box.visible {
      display: flex;
    }

    .result-box a {
      flex: 1;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      word-break: break-all;
    }

    .result-box a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 7px 14px;
      font-size: 0.82rem;
      border-radius: 7px;
      background: #334155;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #475569; opacity: 1; }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 28px 0;
    }

    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .history-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item .short-link a {
      color: #38bdf8;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .history-item .short-link a:hover { text-decoration: underline; }

    .history-item .original {
      color: #64748b;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      color: #475569;
      text-align: center;
      font-size: 0.9rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ URL Shortener</h1>
    <p>Paste a long URL and get a short one instantly.</p>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://example.com/very/long/url..." />
      <button onclick="shortenUrl()">Shorten</button>
    </div>
    <div class="error" id="errorMsg"></div>

    <div class="result-box" id="resultBox">
      <a id="shortLink" href="#" target="_blank"></a>
      <button class="copy-btn" onclick="copyLink()">Copy</button>
    </div>

    <hr class="divider" />

    <div class="history-title">Recent URLs</div>
    <ul class="history-list" id="historyList">
      <li class="empty-state">No URLs shortened yet.</li>
    </ul>
  </div>

  <script>
    const BASE = window.location.origin;

    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const errorMsg = document.getElementById('errorMsg');
      const resultBox = document.getElementById('resultBox');
      const shortLink = document.getElementById('shortLink');

      errorMsg.textContent = '';
      resultBox.classList.remove('visible');

      const url = input.value.trim();
      if (!url) {
        errorMsg.textContent = 'Please enter a URL.';
        return;
      }

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Something went wrong.';
          return;
        }

        const short = `${BASE}/${data.shortCode}`;
        shortLink.href = short;
        shortLink.textContent = short;
        resultBox.classList.add('visible');

        input.value = '';
        loadHistory();
      } catch {
        errorMsg.textContent = 'Network error. Please try again.';
      }
    }

    async function loadHistory() {
      const list = document.getElementById('historyList');
      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();

        if (urls.length === 0) {
          list.innerHTML = '<li class="empty-state">No URLs shortened yet.</li>';
          return;
        }

        list.innerHTML = urls.reverse().map(({ shortCode, originalUrl }) => `
          <li class="history-item">
            <div class="short-link">
              <a href="/${shortCode}" target="_blank">${BASE}/${shortCode}</a>
            </div>
            <div class="original" title="${originalUrl}">${originalUrl}</div>
          </li>
        `).join('');
      } catch {
        list.innerHTML = '<li class="empty-state">Failed to load history.</li>';
      }
    }

    function copyLink() {
      const link = document.getElementById('shortLink').href;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1800);
      });
    }

    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') shortenUrl();
    });

    loadHistory();
  </script>
</body>
</html>
