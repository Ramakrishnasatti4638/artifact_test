<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Registration Form</h1>
    
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-steps">
        <div class="step active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal</div>
        </div>
        <div class="step" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Preferences</div>
        </div>
        <div class="step" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirm</div>
        </div>
      </div>
    </div>

    <!-- Form Container -->
    <form id="wizardForm">
      <!-- Step 1: Personal Details -->
      <div class="form-step active" data-step="1">
        <h2>Personal Details</h2>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <!-- Step 2: Preferences -->
      <div class="form-step" data-step="2">
        <h2>Choose Your Plan</h2>
        <div class="plan-options">
          <label class="plan-card">
            <input type="radio" name="plan" value="basic" required>
            <div class="plan-content">
              <h3>Basic</h3>
              <p class="plan-price">$9/month</p>
              <ul class="plan-features">
                <li>5 Projects</li>
                <li>10GB Storage</li>
                <li>Email Support</li>
              </ul>
            </div>
          </label>
          
          <label class="plan-card">
            <input type="radio" name="plan" value="pro" required>
            <div class="plan-content">
              <h3>Pro</h3>
              <p class="plan-price">$29/month</p>
              <ul class="plan-features">
                <li>Unlimited Projects</li>
                <li>100GB Storage</li>
                <li>Priority Support</li>
                <li>Advanced Analytics</li>
              </ul>
            </div>
          </label>
          
          <label class="plan-card">
            <input type="radio" name="plan" value="enterprise" required>
            <div class="plan-content">
              <h3>Enterprise</h3>
              <p class="plan-price">$99/month</p>
              <ul class="plan-features">
                <li>Unlimited Everything</li>
                <li>1TB Storage</li>
                <li>24/7 Support</li>
                <li>Custom Integration</li>
                <li>Dedicated Manager</li>
              </ul>
            </div>
          </label>
        </div>
      </div>

      <!-- Step 3: Confirmation -->
      <div class="form-step" data-step="3">
        <h2>Confirmation</h2>
        <div class="confirmation-summary">
          <h3>Please review your information:</h3>
          <div class="summary-item">
            <strong>Name:</strong>
            <span id="summaryName"></span>
          </div>
          <div class="summary-item">
            <strong>Email:</strong>
            <span id="summaryEmail"></span>
          </div>
          <div class="summary-item">
            <strong>Plan:</strong>
            <span id="summaryPlan"></span>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="form-navigation">
        <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;">Back</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
        <button type="submit" class="btn btn-success" id="submitBtn" style="display: none;">Submit</button>
      </div>
    </form>

    <!-- Success Message -->
    <div id="successMessage" class="success-message" style="display: none;">
      <h2>✓ Registration Complete!</h2>
      <p>Thank you for registering. We've received your information.</p>
      <button class="btn btn-primary" onclick="location.reload()">Start New Registration</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
