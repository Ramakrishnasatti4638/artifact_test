<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="wizard-container">
      <h1>Registration Form</h1>
      
      <!-- Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      
      <!-- Step Indicators -->
      <div class="step-indicators">
        <div class="step-indicator active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal Details</div>
        </div>
        <div class="step-indicator" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Preferences</div>
        </div>
        <div class="step-indicator" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirmation</div>
        </div>
      </div>

      <!-- Form -->
      <form id="wizardForm">
        <!-- Step 1: Personal Details -->
        <div class="form-step active" data-step="1">
          <h2>Personal Details</h2>
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
            <span class="error-message" id="nameError"></span>
          </div>
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            <span class="error-message" id="emailError"></span>
          </div>
        </div>

        <!-- Step 2: Preferences -->
        <div class="form-step" data-step="2">
          <h2>Choose Your Plan</h2>
          <div class="plan-options">
            <label class="plan-card">
              <input type="radio" name="plan" value="basic" required>
              <div class="plan-content">
                <h3>Basic</h3>
                <div class="plan-price">$9.99/mo</div>
                <ul class="plan-features">
                  <li>✓ 5 Projects</li>
                  <li>✓ 10 GB Storage</li>
                  <li>✓ Email Support</li>
                </ul>
              </div>
            </label>
            
            <label class="plan-card featured">
              <input type="radio" name="plan" value="pro" required>
              <div class="plan-content">
                <div class="featured-badge">Popular</div>
                <h3>Pro</h3>
                <div class="plan-price">$19.99/mo</div>
                <ul class="plan-features">
                  <li>✓ Unlimited Projects</li>
                  <li>✓ 100 GB Storage</li>
                  <li>✓ Priority Support</li>
                  <li>✓ Advanced Analytics</li>
                </ul>
              </div>
            </label>
            
            <label class="plan-card">
              <input type="radio" name="plan" value="enterprise" required>
              <div class="plan-content">
                <h3>Enterprise</h3>
                <div class="plan-price">$49.99/mo</div>
                <ul class="plan-features">
                  <li>✓ Everything in Pro</li>
                  <li>✓ 1 TB Storage</li>
                  <li>✓ 24/7 Support</li>
                  <li>✓ Custom Integration</li>
                  <li>✓ Dedicated Manager</li>
                </ul>
              </div>
            </label>
          </div>
          <span class="error-message" id="planError"></span>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="form-step" data-step="3">
          <h2>Confirm Your Information</h2>
          <div class="confirmation-summary">
            <div class="summary-section">
              <h3>Personal Details</h3>
              <div class="summary-item">
                <span class="summary-label">Name:</span>
                <span class="summary-value" id="summaryName">-</span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Email:</span>
                <span class="summary-value" id="summaryEmail">-</span>
              </div>
            </div>
            
            <div class="summary-section">
              <h3>Selected Plan</h3>
              <div class="summary-item">
                <span class="summary-label">Plan:</span>
                <span class="summary-value" id="summaryPlan">-</span>
              </div>
            </div>
          </div>
          
          <div class="success-message" id="successMessage" style="display: none;">
            <div class="success-icon">✓</div>
            <h3>Registration Successful!</h3>
            <p>Thank you for registering. We'll send a confirmation email shortly.</p>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="form-navigation">
          <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
          <button type="submit" class="btn btn-success" id="submitBtn" style="display: none;">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
