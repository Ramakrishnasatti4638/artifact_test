<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="wizard-header">
      <h1>Registration Form</h1>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="step-indicators">
        <div class="step-indicator active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal Details</div>
        </div>
        <div class="step-indicator" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Preferences</div>
        </div>
        <div class="step-indicator" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirmation</div>
        </div>
      </div>
    </div>

    <form id="wizardForm">
      <!-- Step 1: Personal Details -->
      <div class="form-step active" data-step="1">
        <h2>Personal Details</h2>
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <!-- Step 2: Preferences -->
      <div class="form-step" data-step="2">
        <h2>Choose Your Plan</h2>
        <div class="plan-cards">
          <label class="plan-card">
            <input type="radio" name="plan" value="basic" required>
            <div class="plan-content">
              <div class="plan-header">
                <h3>Basic</h3>
                <div class="plan-price">$9<span>/month</span></div>
              </div>
              <ul class="plan-features">
                <li>✓ 5 Projects</li>
                <li>✓ 10 GB Storage</li>
                <li>✓ Email Support</li>
              </ul>
            </div>
          </label>

          <label class="plan-card">
            <input type="radio" name="plan" value="pro" required>
            <div class="plan-content">
              <div class="plan-header">
                <h3>Pro</h3>
                <div class="plan-price">$29<span>/month</span></div>
              </div>
              <ul class="plan-features">
                <li>✓ 50 Projects</li>
                <li>✓ 100 GB Storage</li>
                <li>✓ Priority Support</li>
                <li>✓ Advanced Analytics</li>
              </ul>
            </div>
          </label>

          <label class="plan-card">
            <input type="radio" name="plan" value="enterprise" required>
            <div class="plan-content">
              <div class="plan-header">
                <h3>Enterprise</h3>
                <div class="plan-price">$99<span>/month</span></div>
              </div>
              <ul class="plan-features">
                <li>✓ Unlimited Projects</li>
                <li>✓ 1 TB Storage</li>
                <li>✓ 24/7 Support</li>
                <li>✓ Custom Integrations</li>
                <li>✓ Dedicated Manager</li>
              </ul>
            </div>
          </label>
        </div>
      </div>

      <!-- Step 3: Confirmation -->
      <div class="form-step" data-step="3">
        <h2>Confirm Your Details</h2>
        <div class="confirmation-summary">
          <div class="summary-section">
            <h3>Personal Information</h3>
            <div class="summary-item">
              <span class="summary-label">Name:</span>
              <span class="summary-value" id="summaryName"></span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Email:</span>
              <span class="summary-value" id="summaryEmail"></span>
            </div>
          </div>
          
          <div class="summary-section">
            <h3>Selected Plan</h3>
            <div class="summary-item">
              <span class="summary-label">Plan:</span>
              <span class="summary-value" id="summaryPlan"></span>
            </div>
            <div class="summary-item">
              <span class="summary-label">Price:</span>
              <span class="summary-value" id="summaryPrice"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="form-navigation">
        <button type="button" id="prevBtn" class="btn btn-secondary" style="display: none;">Back</button>
        <button type="button" id="nextBtn" class="btn btn-primary">Next</button>
        <button type="submit" id="submitBtn" class="btn btn-success" style="display: none;">Submit</button>
      </div>
    </form>

    <!-- Success Message -->
    <div id="successMessage" class="success-message" style="display: none;">
      <div class="success-icon">✓</div>
      <h2>Registration Successful!</h2>
      <p>Thank you for registering. We've sent a confirmation email to your address.</p>
      <button class="btn btn-primary" onclick="location.reload()">Start Over</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
