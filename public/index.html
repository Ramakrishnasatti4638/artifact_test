<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="wizard-card">
      <h1>Registration Form</h1>
      
      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-steps">
          <div class="step active" data-step="1">
            <div class="step-circle">1</div>
            <div class="step-label">Personal</div>
          </div>
          <div class="step" data-step="2">
            <div class="step-circle">2</div>
            <div class="step-label">Preferences</div>
          </div>
          <div class="step" data-step="3">
            <div class="step-circle">3</div>
            <div class="step-label">Confirm</div>
          </div>
        </div>
      </div>

      <!-- Form -->
      <form id="wizardForm">
        <!-- Step 1: Personal Details -->
        <div class="form-step active" data-step="1">
          <h2>Personal Details</h2>
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
            <span class="error-message" id="nameError"></span>
          </div>
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
            <span class="error-message" id="emailError"></span>
          </div>
        </div>

        <!-- Step 2: Preferences -->
        <div class="form-step" data-step="2">
          <h2>Choose Your Plan</h2>
          <div class="plan-options">
            <label class="plan-card">
              <input type="radio" name="plan" value="basic" required>
              <div class="plan-content">
                <div class="plan-icon">📦</div>
                <h3>Basic</h3>
                <p class="plan-price">$9/month</p>
                <ul class="plan-features">
                  <li>✓ 10 Projects</li>
                  <li>✓ Basic Support</li>
                  <li>✓ 5GB Storage</li>
                </ul>
              </div>
            </label>
            <label class="plan-card">
              <input type="radio" name="plan" value="pro" required>
              <div class="plan-content">
                <div class="plan-icon">🚀</div>
                <h3>Pro</h3>
                <p class="plan-price">$29/month</p>
                <ul class="plan-features">
                  <li>✓ Unlimited Projects</li>
                  <li>✓ Priority Support</li>
                  <li>✓ 100GB Storage</li>
                </ul>
              </div>
            </label>
            <label class="plan-card">
              <input type="radio" name="plan" value="enterprise" required>
              <div class="plan-content">
                <div class="plan-icon">⭐</div>
                <h3>Enterprise</h3>
                <p class="plan-price">$99/month</p>
                <ul class="plan-features">
                  <li>✓ Unlimited Everything</li>
                  <li>✓ 24/7 Support</li>
                  <li>✓ 1TB Storage</li>
                </ul>
              </div>
            </label>
          </div>
          <span class="error-message" id="planError"></span>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="form-step" data-step="3">
          <h2>Confirmation</h2>
          <div class="confirmation-summary">
            <div class="summary-section">
              <h3>Personal Information</h3>
              <div class="summary-item">
                <span class="summary-label">Name:</span>
                <span class="summary-value" id="summaryName"></span>
              </div>
              <div class="summary-item">
                <span class="summary-label">Email:</span>
                <span class="summary-value" id="summaryEmail"></span>
              </div>
            </div>
            <div class="summary-section">
              <h3>Selected Plan</h3>
              <div class="summary-item">
                <span class="summary-label">Plan:</span>
                <span class="summary-value" id="summaryPlan"></span>
              </div>
            </div>
          </div>
          <p class="confirmation-note">Please review your information before submitting.</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
          <div class="success-icon">✓</div>
          <h2>Success!</h2>
          <p>Your form has been submitted successfully.</p>
          <button type="button" class="btn btn-primary" onclick="location.reload()">Start Over</button>
        </div>

        <!-- Navigation Buttons -->
        <div class="form-navigation">
          <button type="button" class="btn btn-secondary" id="prevBtn">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
