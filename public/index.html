<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p>Make your long URLs short and shareable</p>
    </header>

    <main>
      <section class="shortener-section">
        <div class="input-group">
          <input
            type="url"
            id="urlInput"
            placeholder="Enter your long URL here..."
            class="url-input"
          >
          <button id="shortenBtn" class="btn btn-primary">Shorten</button>
        </div>

        <div id="errorMsg" class="error-message" style="display: none;"></div>
        <div id="successMsg" class="success-message" style="display: none;">
          <p>Short URL created successfully!</p>
          <div class="result-box">
            <div class="result-item">
              <span class="label">Short Code:</span>
              <span id="resultCode" class="value"></span>
              <button class="btn-copy" onclick="copyToClipboard('resultCode')">Copy</button>
            </div>
            <div class="result-item">
              <span class="label">Short URL:</span>
              <span id="resultUrl" class="value"></span>
              <button class="btn-copy" onclick="copyToClipboard('resultUrl')">Copy</button>
            </div>
            <div class="result-item">
              <span class="label">Original URL:</span>
              <span id="resultOriginal" class="value"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="urls-section">
        <h2>Recently Shortened URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-message">No URLs shortened yet. Create one above!</p>
        </div>
      </section>
    </main>

    <footer>
      <p>Built with Express & Vanilla JS</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
