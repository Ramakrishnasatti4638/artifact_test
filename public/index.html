<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Turn long URLs into short, shareable links</p>
    </header>

    <main>
      <div class="form-section">
        <form id="shortenForm">
          <div class="input-group">
            <input
              type="url"
              id="urlInput"
              placeholder="Enter your long URL here..."
              required
            >
            <button type="submit" class="btn-primary">Shorten</button>
          </div>
          <p id="errorMessage" class="error-message"></p>
        </form>
      </div>

      <div id="resultSection" class="result-section hidden">
        <div class="result-card">
          <div class="result-row">
            <label>Short URL</label>
            <div class="result-value">
              <input type="text" id="shortUrlOutput" readonly>
              <button id="copyBtn" class="btn-secondary">Copy</button>
            </div>
          </div>

          <div class="result-row">
            <label>Original URL</label>
            <input type="text" id="originalUrlOutput" readonly>
          </div>

          <div class="result-row">
            <label>Created</label>
            <input type="text" id="createdAtOutput" readonly>
          </div>

          <div class="result-row">
            <label>Clicks</label>
            <input type="text" id="clicksOutput" readonly class="clicks-input">
          </div>
        </div>
      </div>

      <div class="urls-section">
        <h2>Your Shortened URLs</h2>
        <div id="urlsList" class="urls-list">
          <p class="empty-state">No URLs shortened yet. Create one above!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
