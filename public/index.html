<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form Wizard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="wizard-container">
      <h1>Registration Wizard</h1>
      
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active" data-step="1">
          <div class="step-number">1</div>
          <div class="step-label">Personal</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="2">
          <div class="step-number">2</div>
          <div class="step-label">Plan</div>
        </div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="3">
          <div class="step-number">3</div>
          <div class="step-label">Confirm</div>
        </div>
      </div>

      <!-- Form Steps -->
      <form id="wizardForm">
        <!-- Step 1: Personal Details -->
        <div class="form-step active" data-step="1">
          <h2>Personal Details</h2>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            <span class="error-message" id="nameError"></span>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <span class="error-message" id="emailError"></span>
          </div>
        </div>

        <!-- Step 2: Plan Selection -->
        <div class="form-step" data-step="2">
          <h2>Choose Your Plan</h2>
          <div class="plans-container">
            <div class="plan-card" data-plan="basic">
              <input type="radio" id="basic" name="plan" value="basic" required>
              <label for="basic">
                <h3>Basic</h3>
                <div class="price">$9.99<span>/month</span></div>
                <ul class="features">
                  <li>✓ 10 GB Storage</li>
                  <li>✓ Basic Support</li>
                  <li>✓ 1 User</li>
                </ul>
              </label>
            </div>
            <div class="plan-card popular" data-plan="pro">
              <div class="popular-badge">Most Popular</div>
              <input type="radio" id="pro" name="plan" value="pro" required>
              <label for="pro">
                <h3>Pro</h3>
                <div class="price">$19.99<span>/month</span></div>
                <ul class="features">
                  <li>✓ 100 GB Storage</li>
                  <li>✓ Priority Support</li>
                  <li>✓ 5 Users</li>
                </ul>
              </label>
            </div>
            <div class="plan-card" data-plan="enterprise">
              <input type="radio" id="enterprise" name="plan" value="enterprise" required>
              <label for="enterprise">
                <h3>Enterprise</h3>
                <div class="price">$49.99<span>/month</span></div>
                <ul class="features">
                  <li>✓ Unlimited Storage</li>
                  <li>✓ 24/7 Support</li>
                  <li>✓ Unlimited Users</li>
                </ul>
              </label>
            </div>
          </div>
          <span class="error-message" id="planError"></span>
        </div>

        <!-- Step 3: Confirmation -->
        <div class="form-step" data-step="3">
          <h2>Confirm Your Information</h2>
          <div class="confirmation-content">
            <div class="confirmation-section">
              <h3>Personal Details</h3>
              <p><strong>Name:</strong> <span id="confirmName"></span></p>
              <p><strong>Email:</strong> <span id="confirmEmail"></span></p>
            </div>
            <div class="confirmation-section">
              <h3>Selected Plan</h3>
              <p><strong>Plan:</strong> <span id="confirmPlan"></span></p>
            </div>
          </div>
        </div>

        <!-- Success Message -->
        <div class="form-step success-message" data-step="success">
          <div class="success-icon">✓</div>
          <h2>Registration Complete!</h2>
          <p>Thank you for registering, <strong id="successName"></strong>!</p>
          <p>A confirmation email has been sent to <strong id="successEmail"></strong>.</p>
          <button type="button" class="btn btn-primary" id="startOverBtn">Start Over</button>
        </div>

        <!-- Navigation Buttons -->
        <div class="form-navigation">
          <button type="button" class="btn btn-secondary" id="prevBtn">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
