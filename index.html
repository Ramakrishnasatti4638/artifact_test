<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.06);
      --shadow-hover: 0 8px 24px rgba(0,0,0,.12), 0 0 1px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Navbar ──────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .nav-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -.5px;
    }

    .cart-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .5rem 1rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s;
    }

    .cart-btn:hover { background: var(--primary-hover); }

    .cart-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      background: #fff;
      color: var(--primary);
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      line-height: 1;
      transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    }

    .cart-count.bump {
      transform: scale(1.4);
    }

    /* ── Main ────────────────────────────────────────────── */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: .3rem;
    }

    .page-sub {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 2rem;
    }

    /* ── Grid ────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow .22s, transform .22s;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      user-select: none;
    }

    .card-body {
      padding: 1.1rem 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      flex: 1;
    }

    .card-category {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: .8rem;
    }

    .card-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: .5rem .95rem;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .12s;
    }

    .add-btn:hover  { background: var(--primary-hover); }
    .add-btn:active { transform: scale(.94); }

    .add-btn.added {
      background: #059669;
      animation: pop .3s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* ── Toast ───────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #111827;
      color: #fff;
      padding: .65rem 1.4rem;
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav>
  <span class="nav-brand">⚡ Shopify</span>
  <button class="cart-btn" aria-label="Cart">
    <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    Cart
    <span class="cart-count" id="cart-count">0</span>
  </button>
</nav>

<!-- Main content -->
<main>
  <h1 class="page-title">Featured Products</h1>
  <p class="page-sub">Hand-picked favourites just for you.</p>
  <div class="grid" id="product-grid"></div>
</main>

<div id="toast"></div>

<script>
  const products = [
    { id: 1, name: "Wireless Noise-Cancelling Headphones", category: "Audio",     price: 89.99,  emoji: "🎧", color: "#dbeafe" },
    { id: 2, name: "Mechanical Keyboard (TKL)",            category: "Computing", price: 119.00, emoji: "⌨️",  color: "#ede9fe" },
    { id: 3, name: "Minimalist Leather Watch",             category: "Wearables", price: 149.50, emoji: "⌚",  color: "#fce7f3" },
    { id: 4, name: "Portable Espresso Maker",              category: "Kitchen",   price: 64.95,  emoji: "☕",  color: "#fef3c7" },
    { id: 5, name: "Ultra-Wide Curved Monitor",            category: "Computing", price: 399.00, emoji: "🖥️",  color: "#d1fae5" },
    { id: 6, name: "Polarised Sunglasses",                 category: "Fashion",   price: 54.00,  emoji: "🕶️",  color: "#ffedd5" },
  ];

  let cartCount = 0;
  const countEl = document.getElementById("cart-count");
  const toast   = document.getElementById("toast");
  let toastTimer;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function bumpCounter() {
    countEl.classList.remove("bump");
    // force reflow so the animation restarts each click
    void countEl.offsetWidth;
    countEl.classList.add("bump");
    countEl.addEventListener("transitionend", () => countEl.classList.remove("bump"), { once: true });
  }

  function addToCart(btn, name) {
    cartCount++;
    countEl.textContent = cartCount;
    bumpCounter();
    showToast(`"${name}" added to cart`);

    btn.textContent = "Added ✓";
    btn.classList.add("added");
    btn.disabled = true;

    setTimeout(() => {
      btn.textContent = "Add to Cart";
      btn.classList.remove("added");
      btn.disabled = false;
    }, 1400);
  }

  const grid = document.getElementById("product-grid");

  products.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="card-image" style="background:${p.color}">${p.emoji}</div>
      <div class="card-body">
        <span class="card-category">${p.category}</span>
        <h2 class="card-name">${p.name}</h2>
        <div class="card-footer">
          <span class="card-price">$${p.price.toFixed(2)}</span>
          <button class="add-btn">Add to Cart</button>
        </div>
      </div>
    `;
    card.querySelector(".add-btn").addEventListener("click", function () {
      addToCart(this, p.name);
    });
    grid.appendChild(card);
  });
</script>
</body>
</html>
